name: Keep Sonara Bridge Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes
  workflow_dispatch:          # Manual trigger option

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Sonara Render Bridge
        run: |
          echo "Pinging Sonara Telephony Bridge..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://sonara-voice-agent.onrender.com/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Sonara Bridge is ALIVE!"
          else
            echo "⚠️ Bridge responded with status $STATUS"
          fi
